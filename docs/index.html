<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Onboarding - Início</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">📋 Portal de Onboarding</div>
  <nav>
    <a href='index.html'>Início</a>
    <a href='onboarding.html'>Novo Onboarding</a>
    <a href='relatorios.html'>Relatório Mensal</a>
    <a href='inconsistencias.html'>Inconsistências</a>
    <a href='dashboard.html'>Dashboard</a>
  </nav>
</div>

<div class="container">
  <h1>Ranking de Onboarding do Mês</h1>
  <p class="subtitle" id="month-subtitle">Carregando...</p>

  <div class="card">
    <div id="podium-wrap">
      <p class="loading">Carregando ranking...</p>
    </div>
  </div>

  <div class="grid cols-3">
    <div class="card kpi">
      <div class="value" id="kpi-total">-</div>
      <div class="label">Onboardings no mês</div>
    </div>
    <div class="card kpi">
      <div class="value" id="kpi-empresas">-</div>
      <div class="label">Empresas atendidas no mês</div>
    </div>
    <div class="card kpi">
      <div class="value" id="kpi-media">-</div>
      <div class="label">Nota média da ligação</div>
    </div>
  </div>

  <div class="card">
    <h2>Últimos onboardings registrados</h2>
    <div id="recent-wrap"><p class="loading">Carregando...</p></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
async function load() {
  const monthValue = currentMonthValue();
  document.getElementById("month-subtitle").textContent = monthLabel(monthValue);

  let records = [];
  try {
    records = await apiGet("/api/onboarding");
  } catch (e) {
    document.getElementById("podium-wrap").innerHTML = '<p class="empty-state">Não foi possível carregar os dados agora.</p>';
    showToast(e.message, "error");
    return;
  }

  const thisMonth = records.filter((r) => isInMonth(r.data, monthValue));

  // Ranking
  const counts = {};
  thisMonth.forEach((r) => {
    counts[r.responsavel] = (counts[r.responsavel] || 0) + 1;
  });
  const ranking = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3);

  const podiumWrap = document.getElementById("podium-wrap");
  if (ranking.length === 0) {
    podiumWrap.innerHTML = '<p class="empty-state">Nenhum onboarding registrado neste mês ainda.</p>';
  } else {
    const medals = ["🥇", "🥈", "🥉"];
    const classes = ["first", "second", "third"];
    let html = '<div class="podium">';
    ranking.forEach(([name, count], i) => {
      html += `<div class="place ${classes[i]}">
        <div class="medal">${medals[i]}</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="count">${count} onboarding${count > 1 ? "s" : ""}</div>
      </div>`;
    });
    html += "</div>";
    podiumWrap.innerHTML = html;
  }

  // KPIs
  document.getElementById("kpi-total").textContent = thisMonth.length;
  document.getElementById("kpi-empresas").textContent = new Set(thisMonth.map((r) => r.empresa.trim().toLowerCase())).size;
  const notas = thisMonth.map((r) => parseFloat(r.notaLigacao)).filter((n) => !isNaN(n));
  document.getElementById("kpi-media").textContent = notas.length ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1) + " ⭐" : "-";

  // Recent
  const recent = [...records].sort((a, b) => (b.criadoEm || "").localeCompare(a.criadoEm || "")).slice(0, 8);
  const recentWrap = document.getElementById("recent-wrap");
  if (recent.length === 0) {
    recentWrap.innerHTML = '<p class="empty-state">Nenhum onboarding registrado ainda. <a href="onboarding.html">Registrar o primeiro</a></p>';
  } else {
    let html = '<table><thead><tr><th>Data</th><th>Responsável</th><th>Empresa</th><th>Classificação</th><th>Nota</th></tr></thead><tbody>';
    recent.forEach((r) => {
      html += `<tr><td>${fmtDate(r.data)}</td><td>${escapeHtml(r.responsavel)}</td><td>${escapeHtml(r.empresa)}</td><td>${escapeHtml(r.classificacao)}</td><td>${escapeHtml(r.notaLigacao)} ⭐</td></tr>`;
    });
    html += "</tbody></table>";
    recentWrap.innerHTML = html;
  }
}
load();
</script>
</body>
</html>
